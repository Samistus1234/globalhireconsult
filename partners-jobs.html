<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2R8CT52B7P"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-2R8CT52B7P");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs — GlobalHire Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: var(--font-body); background: var(--bg-base); color: var(--text-primary); }

    .mp-layout { display: flex; min-height: 100vh; }

    /* ── Sidebar (nav shell reused from partners-messages.html) ── */
    .mp-sidebar {
      width: 248px; flex-shrink: 0;
      background: var(--bg-deep);
      border-right: 1px solid var(--border-subtle);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .mp-sb-brand {
      padding: var(--space-6) var(--space-5) var(--space-5);
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(160deg, rgba(0,119,182,0.08) 0%, transparent 60%);
    }
    .mp-sb-logo { display: flex; align-items: center; gap: var(--space-3); }
    .mp-sb-logo-text { font-size: var(--text-lg); font-weight: 800; color: var(--text-primary); font-family: var(--font-display); }
    .mp-sb-logo-text .accent { color: var(--primary-light); }
    .mp-sb-badge {
      margin-top: var(--space-3);
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--primary-light); background: rgba(0,180,216,0.1); border: 1px solid rgba(0,180,216,0.2);
      padding: 3px 10px; border-radius: var(--radius-full);
    }

    .mp-sb-nav { flex: 1; padding: var(--space-3) var(--space-3) var(--space-4); }
    .mp-nav-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: 10px var(--space-3); border-radius: var(--radius-md);
      font-size: var(--text-sm); font-weight: 500; color: var(--text-secondary);
      cursor: pointer; text-decoration: none;
      margin-bottom: 2px; position: relative; border: 1px solid transparent;
    }
    .mp-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .mp-nav-item.active {
      background: linear-gradient(135deg, rgba(0,119,182,0.18), rgba(0,180,216,0.08));
      color: var(--primary-light); font-weight: 600;
      border-color: rgba(0,119,182,0.2);
    }
    .mp-nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; background: var(--primary-light); border-radius: 0 3px 3px 0;
    }
    .mp-nav-item[aria-disabled="true"] {
      color: var(--text-tertiary); cursor: default; opacity: 0.55; pointer-events: none;
    }
    .mp-nav-soon {
      margin-left: auto; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-tertiary); background: var(--bg-surface); border: 1px solid var(--border-subtle);
      padding: 2px 6px; border-radius: var(--radius-full);
    }

    .mp-sb-footer { padding: var(--space-4); border-top: 1px solid var(--border-subtle); }
    .mp-sb-signout {
      display: block; padding: 10px var(--space-3); border-radius: var(--radius-md);
      font-size: var(--text-sm); color: var(--text-tertiary); cursor: pointer; text-decoration: none;
    }
    .mp-sb-signout:hover { color: var(--error); background: rgba(230,57,70,0.06); }

    /* ── Main ── */
    .mp-main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .mp-topbar {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--space-8); background: var(--bg-deep);
      border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 10;
    }
    .mp-breadcrumb { font-size: var(--text-sm); color: var(--text-tertiary); }
    .mp-breadcrumb strong { color: var(--text-primary); }

    .mp-content { padding: var(--space-8); max-width: 1080px; }

    .mp-card { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-xl); padding: var(--space-6); margin-bottom: var(--space-6); }
    .mp-card h2 { font-size: var(--text-xl); font-weight: 800; font-family: var(--font-display); margin: 0 0 var(--space-3); }
    .mp-card p { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.6; margin: 0 0 var(--space-4); }

    .mp-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700;
      font-size: var(--text-sm); font-family: inherit; cursor: pointer; border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; text-decoration: none;
    }
    .mp-btn:hover { opacity: 0.92; }
    .mp-link { color: var(--primary-light); text-decoration: none; margin-left: var(--space-3); }
    .mp-msg { font-size: var(--text-sm); color: var(--text-tertiary); }

    .mp-page-head { margin-bottom: var(--space-6); }
    .mp-page-head h1 { font-size: var(--text-2xl); font-weight: 800; font-family: var(--font-display); margin: 0 0 6px; }
    .mp-page-head p { font-size: var(--text-sm); color: var(--text-secondary); margin: 0; }

    /* ── Filters ── */
    .mp-filters {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-3);
      background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
      padding: var(--space-4); margin-bottom: var(--space-6); align-items: end;
    }
    .mp-filter-field label {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--text-tertiary); margin-bottom: 6px;
    }
    .mp-select {
      width: 100%; padding: 9px 12px; background: var(--bg-surface);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      color: var(--text-primary); font-family: inherit; font-size: var(--text-sm);
    }
    .mp-select:focus { outline: none; border-color: var(--primary); }
    .mp-filters-clear {
      background: transparent; border: 1px solid var(--border-default); color: var(--text-secondary);
      border-radius: var(--radius-md); padding: 9px 14px; font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .mp-filters-clear:hover { color: var(--text-primary); background: var(--bg-hover); }
    .mp-filters-count { font-size: var(--text-sm); color: var(--text-tertiary); margin: 0 0 var(--space-4); }

    /* ── Job list ── */
    .mp-job-list { display: flex; flex-direction: column; gap: var(--space-4); }
    .mp-job-card {
      display: block; text-decoration: none; color: inherit;
      background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .mp-job-card:hover { border-color: var(--border-accent); background: var(--bg-hover); }
    .mp-job-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: 6px; }
    .mp-job-card h3 { font-size: var(--text-base); font-weight: 700; color: var(--text-primary); margin: 0; font-family: var(--font-display); }
    .mp-job-employer { font-size: var(--text-sm); color: var(--text-secondary); margin: 2px 0 var(--space-3); }
    .mp-job-employer.confidential { font-style: italic; color: var(--text-tertiary); }
    .mp-job-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .mp-pill {
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em; color: var(--text-secondary);
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      padding: 3px 10px; border-radius: var(--radius-full);
    }
    .mp-job-salary { flex-shrink: 0; font-size: var(--text-sm); font-weight: 700; color: var(--primary-light); text-align: right; white-space: nowrap; }
    .mp-empty { padding: var(--space-6); font-size: var(--text-sm); color: var(--text-tertiary); text-align: center; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/globalhire-icon-180.png">
</head>
<body>
  <div class="mp-layout">

    <!-- ═══════════ SIDEBAR — nav shell reused from partners-messages.html ═══════════ -->
    <aside class="mp-sidebar">
      <div class="mp-sb-brand">
        <div class="mp-sb-logo">
          <img src="assets/brand/globalhire-icon-white.png" alt="GlobalHire Consult" style="width:32px;height:32px;object-fit:contain;display:block;flex-shrink:0;">
          <div class="mp-sb-logo-text">Global<span class="accent">Hire</span></div>
        </div>
        <div class="mp-sb-badge">Partner Portal</div>
      </div>

      <nav id="mp-nav" class="mp-sb-nav">
        <a class="mp-nav-item" href="partners-dashboard.html">Dashboard</a>
        <a class="mp-nav-item active" href="partners-jobs.html">Jobs</a>
        <a class="mp-nav-item" href="#" aria-disabled="true">Candidates <span class="mp-nav-soon">Soon</span></a>
        <a class="mp-nav-item" href="#" aria-disabled="true">Nominations <span class="mp-nav-soon">Soon</span></a>
        <a class="mp-nav-item" href="partners-messages.html">Messages</a>
        <a class="mp-nav-item" href="#" aria-disabled="true">Billing <span class="mp-nav-soon">Soon</span></a>
        <a class="mp-nav-item" href="partners-onboarding.html">Team</a>
      </nav>

      <div class="mp-sb-footer">
        <a class="mp-sb-signout" href="login.html">Sign out</a>
      </div>
    </aside>

    <!-- ═══════════ MAIN ═══════════ -->
    <div class="mp-main-wrap">
      <header class="mp-topbar">
        <div class="mp-breadcrumb">GlobalHire Partners / <strong>Jobs</strong></div>
        <div id="mp-bell"></div>
      </header>

      <main class="mp-content">
        <!-- error state (contract: MP.status === 'error' — guards do NOT redirect) -->
        <div id="mp-error" hidden></div>

        <div id="mp-jobs-body">
          <div class="mp-page-head">
            <h1>Open jobs</h1>
            <p>Vacancies GlobalHire has published for the partner network.</p>
          </div>

          <form id="mp-job-filters" class="mp-filters">
            <div class="mp-filter-field">
              <label for="mp-f-specialty">Specialty</label>
              <select class="mp-select" id="mp-f-specialty"><option value="">All specialties</option></select>
            </div>
            <div class="mp-filter-field">
              <label for="mp-f-country">Country</label>
              <select class="mp-select" id="mp-f-country"><option value="">All countries</option></select>
            </div>
            <div class="mp-filter-field">
              <label for="mp-f-city">City</label>
              <select class="mp-select" id="mp-f-city"><option value="">All cities</option></select>
            </div>
            <div class="mp-filter-field">
              <label for="mp-f-seniority">Seniority</label>
              <select class="mp-select" id="mp-f-seniority"><option value="">All levels</option></select>
            </div>
            <div class="mp-filter-field">
              <label for="mp-f-contract">Contract type</label>
              <select class="mp-select" id="mp-f-contract"><option value="">All types</option></select>
            </div>
            <div class="mp-filter-field">
              <button type="button" class="mp-filters-clear" id="mp-f-clear">Clear filters</button>
            </div>
          </form>

          <p class="mp-filters-count" id="mp-job-count"></p>
          <div class="mp-job-list" id="mp-job-list"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/mp-core.js"></script>
  <script src="js/mp-jobs-partner.js"></script>
  <script src="js/mp-bell.js"></script>
  <script>window.addEventListener('load', function(){ window.MPBell.mount(document.getElementById('mp-bell')); });</script>
</body>
</html>
