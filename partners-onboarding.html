<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2R8CT52B7P"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-2R8CT52B7P");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partnership Profile — GlobalHire Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: var(--font-body); background: var(--bg-base); color: var(--text-primary); }

    .mp-topbar {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--space-8); background: var(--bg-deep);
      border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 10;
    }
    .mp-brand { display: flex; align-items: center; gap: var(--space-3); font-weight: 800; font-family: var(--font-display); }
    .mp-brand .accent { color: var(--primary-light); }
    .mp-badge {
      margin-left: var(--space-2); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--primary-light);
      background: rgba(0,180,216,0.1); border: 1px solid rgba(0,180,216,0.2);
      padding: 3px 10px; border-radius: var(--radius-full);
    }
    .mp-signout { font-size: var(--text-sm); color: var(--text-tertiary); text-decoration: none; }
    .mp-signout:hover { color: var(--error); }

    .mp-main { max-width: 880px; margin: 0 auto; padding: var(--space-8); }
    .mp-main h1 { font-size: var(--text-2xl); font-weight: 800; font-family: var(--font-display); margin: 0 0 var(--space-6); }
    .mp-main h2 { font-size: var(--text-lg); font-weight: 700; margin: 0 0 var(--space-4); }

    .mp-card { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-xl); padding: var(--space-6); margin-bottom: var(--space-6); }
    .mp-banner { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-6); font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; }
    .mp-banner a { color: var(--primary-light); text-decoration: none; }

    .mp-field { margin-bottom: var(--space-4); }
    .mp-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .mp-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .mp-input, .mp-select {
      width: 100%; padding: 10px 14px; background: var(--bg-surface);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      color: var(--text-primary); font-family: inherit; font-size: var(--text-sm);
    }
    .mp-input:focus, .mp-select:focus { outline: none; border-color: var(--primary); }
    input[type="file"].mp-input { padding: 8px; }

    fieldset { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); margin: 0 0 var(--space-4); }
    legend { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); padding: 0 6px; }
    .mp-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .mp-checks label { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: 500; color: var(--text-secondary); }
    .mp-checks input { flex-shrink: 0; }

    .mp-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700;
      font-size: var(--text-sm); font-family: inherit; cursor: pointer; border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; text-decoration: none;
    }
    .mp-btn:hover { opacity: 0.92; }
    .mp-btn--ghost { background: transparent; border: 1px solid var(--border-default); color: var(--text-secondary); }
    .mp-link { color: var(--primary-light); text-decoration: none; margin-left: var(--space-3); }
    .mp-msg { font-size: var(--text-sm); color: var(--text-tertiary); margin-top: 10px; min-height: 1.2em; }

    table { width: 100%; border-collapse: collapse; margin-bottom: var(--space-4); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); }
    .mp-invite-row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: flex-end; }
    .mp-invite-row .mp-field { margin-bottom: 0; flex: 1; min-width: 180px; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/globalhire-icon-180.png">
</head>
<body>
  <header class="mp-topbar">
    <div class="mp-brand">
      <img src="assets/brand/globalhire-icon-white.png" alt="GlobalHire Consult" style="width:32px;height:32px;object-fit:contain;display:block;flex-shrink:0;">
      <span>Global<span class="accent">Hire</span> Partners</span>
      <span class="mp-badge">Partner Portal</span>
    </div>
    <a class="mp-signout" href="login.html">Sign out</a>
  </header>

  <main class="mp-main">
    <!-- error state (contract: MP.status === 'error' — guards do NOT redirect) -->
    <div id="mp-error" hidden></div>

    <div id="mp-onboarding-body">
      <h1>Partnership profile</h1>

      <div id="mp-status-banner" class="mp-banner" role="status" aria-live="polite"></div>

      <form id="mp-profile-form">
        <div class="mp-card">
          <h2>Agency details</h2>

          <div class="mp-field">
            <label for="mp-name">Agency name *</label>
            <input class="mp-input" type="text" id="mp-name" name="name" required>
          </div>

          <div class="mp-row">
            <div class="mp-field">
              <label for="mp-country">Country</label>
              <input class="mp-input" type="text" id="mp-country" name="country">
            </div>
            <div class="mp-field">
              <label for="mp-city">City</label>
              <input class="mp-input" type="text" id="mp-city" name="city">
            </div>
          </div>

          <div class="mp-field">
            <label for="mp-address">Address</label>
            <input class="mp-input" type="text" id="mp-address" name="address">
          </div>

          <div class="mp-row">
            <div class="mp-field">
              <label for="mp-website">Website</label>
              <input class="mp-input" type="url" id="mp-website" name="website" placeholder="https://">
            </div>
            <div class="mp-field">
              <label for="mp-year-founded">Year founded</label>
              <input class="mp-input" type="number" id="mp-year-founded" name="year_founded" min="1900" max="2100" step="1">
            </div>
          </div>

          <div class="mp-field">
            <label for="mp-owner-name">Owner / principal name</label>
            <input class="mp-input" type="text" id="mp-owner-name" name="owner_name">
          </div>
        </div>

        <div class="mp-card">
          <h2>What we do</h2>

          <fieldset>
            <legend>Services offered</legend>
            <div class="mp-checks">
              <label><input type="checkbox" name="services" value="flight_tickets"> Flight tickets</label>
              <label><input type="checkbox" name="services" value="candidate_sourcing"> Candidate sourcing</label>
              <label><input type="checkbox" name="services" value="local_recruitment"> Local recruitment</label>
              <label><input type="checkbox" name="services" value="medical_verification_licensing"> Medical verification &amp; licensing</label>
              <label><input type="checkbox" name="services" value="international_recruitment"> International recruitment</label>
              <label><input type="checkbox" name="services" value="visa_clearance"> Visa clearance</label>
              <label><input type="checkbox" name="services" value="job_opportunities"> Job opportunities</label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Areas of cooperation</legend>
            <div class="mp-checks">
              <label><input type="checkbox" name="cooperation_areas" value="have_jobs_want_candidates"> We have jobs and want candidates</label>
              <label><input type="checkbox" name="cooperation_areas" value="have_candidates_to_nominate"> We have candidates to nominate</label>
              <label><input type="checkbox" name="cooperation_areas" value="dataflow_licensing_partnership"> DataFlow / licensing partnership</label>
              <label><input type="checkbox" name="cooperation_areas" value="be_your_agent"> Act as your agent</label>
              <label><input type="checkbox" name="cooperation_areas" value="international_partnership"> International partnership</label>
              <label><input type="checkbox" name="cooperation_areas" value="urgent_recruitment"> Urgent recruitment</label>
              <label><input type="checkbox" name="cooperation_areas" value="gulf_market_partnership"> Gulf market partnership</label>
              <label><input type="checkbox" name="cooperation_areas" value="permanent_recruitment"> Permanent recruitment</label>
              <label><input type="checkbox" name="cooperation_areas" value="temporary_recruitment"> Temporary / locum recruitment</label>
              <label><input type="checkbox" name="cooperation_areas" value="new_market_entry"> New market entry</label>
              <label><input type="checkbox" name="cooperation_areas" value="visa_clearance"> Visa clearance</label>
              <label><input type="checkbox" name="cooperation_areas" value="flight_booking_for_clients"> Flight booking for clients</label>
            </div>
          </fieldset>
        </div>

        <div class="mp-card">
          <h2>Documents</h2>
          <div class="mp-field">
            <label for="mp-licence-file">Trade / recruitment licence (PDF or image)</label>
            <input class="mp-input" type="file" id="mp-licence-file" name="licence_file" accept=".pdf,.png,.jpg,.jpeg">
          </div>
          <div class="mp-field">
            <label for="mp-company-profile-file">Company profile (PDF or image)</label>
            <input class="mp-input" type="file" id="mp-company-profile-file" name="company_profile_file" accept=".pdf,.png,.jpg,.jpeg">
          </div>
        </div>

        <button type="submit" class="mp-btn">Save profile</button>
        <div id="mp-profile-msg" class="mp-msg" role="status" aria-live="polite"></div>
      </form>

      <section id="mp-team" class="mp-card" hidden>
        <h2>Team</h2>
        <table>
          <thead><tr><th>Member</th><th>Role</th><th>Status</th></tr></thead>
          <tbody id="mp-team-list"></tbody>
        </table>

        <form id="mp-invite-form">
          <div class="mp-invite-row">
            <div class="mp-field">
              <label for="mp-invite-email">Invite by email</label>
              <input class="mp-input" type="email" id="mp-invite-email" name="email" required placeholder="colleague@agency.com">
            </div>
            <div class="mp-field" style="flex:0 0 160px;">
              <label for="mp-invite-role">Role</label>
              <select class="mp-select" id="mp-invite-role" name="role">
                <option value="member">Member</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button type="submit" class="mp-btn">Send invite</button>
          </div>
        </form>
        <div id="mp-invite-msg" class="mp-msg" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/mp-core.js"></script>
  <script src="js/mp-onboarding.js"></script>
</body>
</html>
