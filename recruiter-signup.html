<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2R8CT52B7P"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-2R8CT52B7P");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Registration — GlobalHire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: var(--bg-base); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-6); }
    .reg-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      width: 100%;
      max-width: 480px;
    }
    .reg-logo { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-8); }
    .reg-logo-icon { width: 38px; height: 38px; background: var(--primary); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 16px; }
    .reg-logo-text { font-size: var(--text-xl); font-weight: 800; color: var(--text-primary); }
    .reg-logo-text span { color: var(--primary); }
    .reg-heading { font-size: var(--text-2xl); font-weight: 800; color: var(--text-primary); margin-bottom: var(--space-1); }
    .reg-sub { font-size: var(--text-sm); color: var(--text-tertiary); margin-bottom: var(--space-8); }
    .form-group { margin-bottom: var(--space-4); }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2); }
    .form-input {
      width: 100%; padding: var(--space-3) var(--space-4);
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); color: var(--text-primary);
      font-size: var(--text-sm); font-family: inherit;
      box-sizing: border-box; transition: border-color 0.15s;
    }
    .form-input:focus { outline: none; border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .alert { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm); margin-bottom: var(--space-4); display: none; }
    .alert-error { background: rgba(230,57,70,0.1); border: 1px solid rgba(230,57,70,0.3); color: #E63946; }
    .alert-success { background: rgba(46,196,182,0.1); border: 1px solid rgba(46,196,182,0.3); color: #2EC4B6; }
    .reg-footer { text-align: center; margin-top: var(--space-6); font-size: var(--text-sm); color: var(--text-tertiary); }
    .reg-footer a { color: var(--primary); text-decoration: none; }
    .divider { border: none; border-top: 1px solid var(--border-subtle); margin: var(--space-6) 0; }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/globalhire-icon-180.png">
</head>
<body>
  <div class="reg-card">
    <div class="reg-logo">
      <div class="reg-logo-icon">G</div>
      <div class="reg-logo-text">Global<span>Hire</span></div>
    </div>

    <div class="reg-heading">Recruiter Registration</div>
    <div class="reg-sub">Create your recruiter account to access matched candidates</div>

    <div id="reg-alert" class="alert alert-error"></div>
    <div id="reg-success" class="alert alert-success"></div>

    <form id="reg-form">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" id="reg-name" class="form-input" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label class="form-label">Work Email *</label>
        <input type="email" id="reg-email" class="form-input" placeholder="you@hospital.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Min. 8 characters" required minlength="8">
      </div>

      <hr class="divider">

      <div class="form-group">
        <label class="form-label">Organisation / Hospital Name *</label>
        <input type="text" id="reg-org" class="form-input" placeholder="e.g. King Fahad Medical City" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Country</label>
          <input type="text" id="reg-country" class="form-input" placeholder="e.g. Saudi Arabia">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="reg-phone" class="form-input" placeholder="+966...">
        </div>
      </div>

      <button type="submit" id="reg-submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:var(--space-2);">
        Create Recruiter Account
      </button>
    </form>

    <div class="reg-footer">
      Already have an account? <a href="login.html">Sign in</a>
      &nbsp;·&nbsp; Are you a healthcare professional? <a href="signup.html">Register here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('reg-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      var alertEl = document.getElementById('reg-alert');
      var successEl = document.getElementById('reg-success');
      var submitBtn = document.getElementById('reg-submit');

      alertEl.style.display = 'none';
      successEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating account...';

      var name = document.getElementById('reg-name').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var password = document.getElementById('reg-password').value;
      var org = document.getElementById('reg-org').value.trim();
      var country = document.getElementById('reg-country').value.trim();
      var phone = document.getElementById('reg-phone').value.trim();

      try {
        var resp = await fetch(SUPABASE_URL + '/functions/v1/recruiter-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: name,
            email: email,
            password: password,
            organization_name: org,
            country: country,
            phone: phone
          })
        });

        var result = await resp.json();

        if (!resp.ok || !result.success) {
          throw new Error(result.error || 'Registration failed');
        }

        // Show success, hide form
        document.getElementById('reg-form').style.display = 'none';
        successEl.style.display = 'block';
        successEl.innerHTML = '<strong>Registration submitted!</strong><br>Your account is pending admin approval. You will be able to log in once approved. We will notify you by email.';

      } catch (err) {
        alertEl.textContent = err.message || 'Registration failed. Please try again.';
        alertEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Recruiter Account';
      }
    });
  </script>
</body>
</html>
